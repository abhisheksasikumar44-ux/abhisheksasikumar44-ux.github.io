<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Pet Landing Page</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(-45deg,#6C63FF,#00C9A7,#5EE7DF,#B490CA);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    width:90%;
    max-width:700px;
    padding:40px;
    border-radius:25px;
    text-align:center;
    backdrop-filter:blur(15px);
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    color:white;
}

h1{
    font-size:3rem;
}

p{
    margin:20px 0;
    line-height:1.7;
}

button{
    padding:14px 30px;
    border:none;
    border-radius:40px;
    background:white;
    color:#5b4bff;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

/* Floating bubbles */

.bubble{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    animation:float 12s linear infinite;
}

.b1{
    width:160px;
    height:160px;
    left:8%;
    top:10%;
}

.b2{
    width:250px;
    height:250px;
    right:-60px;
    bottom:-60px;
}

.b3{
    width:90px;
    height:90px;
    left:25%;
    bottom:12%;
}

@keyframes float{
    50%{
        transform:translateY(-25px);
    }
}

/* PET */

.pet{
    width:170px;
    margin:20px auto;
    animation:bounce 2s ease-in-out infinite;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-18px);
    }
}

.head{
    width:120px;
    height:110px;
    background:#FFD79A;
    border-radius:50%;
    margin:auto;
    position:relative;
}

.ear{
    width:35px;
    height:55px;
    background:#C98A45;
    position:absolute;
    top:-20px;
    border-radius:20px;
}

.left-ear{
    left:5px;
    transform:rotate(-25deg);
}

.right-ear{
    right:5px;
    transform:rotate(25deg);
}

.eye{
    width:12px;
    height:12px;
    background:#222;
    border-radius:50%;
    position:absolute;
    top:42px;
    animation:blink 5s infinite;
}

.left-eye{
    left:35px;
}

.right-eye{
    right:35px;
}

@keyframes blink{
    0%,47%,100%{
        height:12px;
    }
    48%,50%{
        height:2px;
    }
}

.nose{
    width:18px;
    height:14px;
    background:#333;
    border-radius:50%;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:62px;
}

.mouth{
    position:absolute;
    width:24px;
    height:14px;
    border-bottom:3px solid #333;
    border-radius:0 0 20px 20px;
    left:50%;
    transform:translateX(-50%);
    top:76px;
}

.body{
    width:90px;
    height:90px;
    background:#FFD79A;
    margin:0 auto;
    margin-top:-8px;
    border-radius:25px;
    position:relative;
}

.tail{
    position:absolute;
    width:45px;
    height:8px;
    background:#C98A45;
    right:-32px;
    top:25px;
    transform-origin:left center;
    animation:wag .35s infinite alternate;
}

@keyframes wag{
    from{
        transform:rotate(20deg);
    }
    to{
        transform:rotate(-20deg);
    }
}
</style>
</head>

<body>

<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>

<div class="card">

    <div class="pet">

        <div class="head">
            <div class="ear left-ear"></div>
            <div class="ear right-ear"></div>

            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>

            <div class="nose"></div>
            <div class="mouth"></div>
        </div>

        <div class="body">
            <div class="tail"></div>
        </div>

    </div>

    <h1>🐶 Welcome!</h1>

    <p>
        Welcome to my website.It is created by Abhishek Sasikumar
        Meet your friendly animated puppy! It happily bounces,
        blinks its eyes, and wags its tail while greeting visitors
        to your website.
    </p>

    <button onclick="petMe()">🐾 Pet Me</button>

</div>

<script>
function petMe(){
    alert("🐶 Woof! Thanks for the pets! ❤️");
}
</script>

</body>
</html>
